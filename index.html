<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MOTD</title>
  <style>
    body { margin:0; background:black; overflow:hidden; }
    img, video { width:100vw; height:100vh; object-fit:contain; }
  </style>
</head>
<body>

  <video id="motdVideo" muted loop autoplay playsinline preload="metadata" style="display:none;">
    <source src="motd1.mp4" type="video/mp4">
  </video>

  <img id="motdImage" style="display:none;" />

  <script>
  const mediaPool = [
    { type:"video", src:"motd1.mp4" },
    { type:"image", src:"motd1.png" },
    { type:"image", src:"motd2.jpg" },
    { type:"image", src:"motd3.png" }
  ];

  const v = document.getElementById("motdVideo");
  const img = document.getElementById("motdImage");
  const pick = mediaPool[(Math.random() * mediaPool.length) | 0];

  function showImage(src) {
    v.style.display = "none";
    img.style.display = "block";
    img.src = src;
  }

  if (pick.type === "video") {
    // Keep <source> approach: set it once, early
    v.innerHTML = '<source src="' + pick.src + '" type="video/mp4">';
    v.style.display = "block";
    img.style.display = "none";
    v.play();

    // tiny watchdog: if it doesn't start, show a random image
    setTimeout(() => {
      if (v.readyState < 1) {
        const imgs = mediaPool.filter(m => m.type === "image");
        showImage(imgs[(Math.random() * imgs.length) | 0].src);
      }
    }, 2000);
  } else {
    showImage(pick.src);
  }
</script>

</body>
</html>
