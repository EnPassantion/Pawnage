<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MOTD</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }
        img, video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
        video {
            display: none;
        }
    </style>
</head>
<body>

    <img id="motdImage" src="" />
    
    <video id="motdVideo" autoplay muted loop playsinline>
        <source src="motd.mp4" type="video/mp4">
    </video>

    <script>
        // ===== SETTINGS =====
        var useVideo = true; // set to false if you only want images
        
        var images = [
            "motd1.png",
            "motd2.jpg",
            "motd3.png"
        ];

        var video = document.getElementById("motdVideo");
        var image = document.getElementById("motdImage");

        function showRandomImage() {
            var randomImage = images[Math.floor(Math.random() * images.length)];
            image.src = randomImage;
            image.style.display = "block";
            video.style.display = "none";
        }

        if (useVideo) {
            // Try to play video (meme clip)
            video.style.display = "block";
            image.style.display = "none";

            // If video fails (very common in UE3/Scaleform), fallback to image
            video.onerror = function() {
                showRandomImage();
            };

            // Safety fallback if video never starts (GFx compatibility)
            setTimeout(function() {
                if (video.readyState === 0) {
                    showRandomImage();
                }
            }, 2000);
        } else {
            showRandomImage();
        }
    </script>

</body>
</html>
