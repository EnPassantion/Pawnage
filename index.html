<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MOTD</title>
  <style>
    body { margin:0; background:black; overflow:hidden; }
    img, video { width:100vw; height:100vh; object-fit:contain; }
  </style>
</head>
<body>

  <video id="motdVideo" muted loop autoplay playsinline preload="metadata" style="display:none;">
    <source src="motd1.mp4" type="video/mp4">
  </video>

  <img id="motdImage" style="display:none;" />

<script>
  // Put ALL media (videos + images) in one list
  const mediaPool = [
    { type: "video", src: "motd1.mp4" },
    { type: "image", src: "motd1.png" },
    { type: "image", src: "motd2.jpg" },
    { type: "image", src: "motd3.png" }
  ];

  const v = document.getElementById("motdVideo");
  const img = document.getElementById("motdImage");

  function showRandomMedia() {
    const pick = mediaPool[Math.floor(Math.random() * mediaPool.length)];

    if (pick.type === "video") {
      // Show video
      img.style.display = "none";
      v.style.display = "block";
      v.src = pick.src;
      v.muted = true;
      v.loop = true;
      v.play().catch(() => {
        // If video fails (GFx / autoplay), fallback to image
        showFallbackImage();
      });
    } else {
      // Show image
      v.pause();
      v.style.display = "none";
      img.style.display = "block";
      img.src = pick.src;
    }
  }

  function showFallbackImage() {
    const imageOptions = mediaPool.filter(m => m.type === "image");
    const pick = imageOptions[Math.floor(Math.random() * imageOptions.length)];
    v.pause();
    v.style.display = "none";
    img.style.display = "block";
    img.src = pick.src;
  }

  // Error handling (important for Chivalry / older browsers)
  v.addEventListener("error", showFallbackImage);

  // Start randomized display
  showRandomMedia();
</script>

</body>
</html>
