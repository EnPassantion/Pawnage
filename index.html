<script>
  const media = [
    { type: "video", src: "motd1.mp4" },
  ];

  const PERIOD = 6 * 60 * 60 * 1000;
  const block = Math.floor(Date.now() / PERIOD);
  const blockInDay = block % media.length;
  const day = Math.floor(block / media.length);

  function lcg(seed){
    let x = seed >>> 0;
    return function(){
      x = (1664525 * x + 1013904223) >>> 0;
      return x;
    };
  }

  const rand = lcg(day ^ 0xA5A5A5A5);
  const order = media.slice();

  for (let i = order.length - 1; i > 0; i--) {
    const j = rand() % (i + 1);
    [order[i], order[j]] = [order[j], order[i]];
  }

  const pick = order[blockInDay];

  if (pick.type === "video") {
    location.replace("video.html?src=" + pick.src);
  } else {
    location.replace(pick.src);
  }
</script>
