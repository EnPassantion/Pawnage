<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MOTD</title>
  <style>
    body { margin:0; background:black; overflow:hidden; }
    img, video { width:100vw; height:100vh; object-fit:contain; }
  </style>
</head>
<body>

  <video id="motdVideo" muted loop autoplay playsinline preload="metadata" style="display:none;">
    <source src="motd1.mp4" type="video/mp4">
  </video>

  <img id="motdImage" style="display:none;" />

  <script>
    const images = ["motd1.png","motd2.jpg","motd3.png"];
    const v = document.getElementById("motdVideo");
    const img = document.getElementById("motdImage");

    function showRandomImage() {
      const pick = images[Math.floor(Math.random() * images.length)];
      img.src = pick;
      img.style.display = "block";
      v.style.display = "none";
    }

    // Show video first
    v.style.display = "block";
    img.style.display = "none";
    v.muted = true;

    // If the video errors, fallback immediately
    v.addEventListener("error", showRandomImage);

    // Try to start playback; if blocked, fallback
    const p = v.play();
    if (p && p.catch) {
      p.catch(showRandomImage);
    }

    // Safety: if it never loads metadata, fallback after 2s
    setTimeout(() => {
      if (v.readyState < 1) showRandomImage();
    }, 2000);
  </script>

</body>
</html>
